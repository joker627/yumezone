<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="Explora el catálogo completo de mangas, manhwas y manhuas en español en YumeZone. Filtra por géneros, estado de emisión, demografía y popularidad.">
  <meta name="keywords" content="catalogo manga, buscar manhwa, generos manga, leer manhwa español, webtoons completos, yumezone">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YumeZone">
  <meta property="og:url" content="https://yumezone.page/pages/catalogo.html">
  <meta property="og:title" content="Catálogo de Mangas, Manhwas y Manhuas en Español | YumeZone">
  <meta property="og:description" content="Explora cientos de obras en español. Filtra por géneros, estado, demografía y popularidad.">
  <meta property="og:image" content="https://yumezone.page/assets/icons/logo.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://yumezone.page/pages/catalogo.html">
  <meta name="twitter:title" content="Catálogo de Mangas, Manhwas y Manhuas en Español | YumeZone">
  <meta name="twitter:description" content="Explora cientos de obras en español. Filtra por géneros, estado, demografía y popularidad.">
  <meta name="twitter:image" content="https://yumezone.page/assets/icons/logo.png">

  <link rel="canonical" href="https://yumezone.page/pages/catalogo.html">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YumeZone">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json">
  <title>Catálogo de Mangas, Manhwas y Manhuas en Español | YumeZone</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/header.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/pages/catalogo.css">
</head>
<body>
  <header id="header"></header>

  <main id="catalog-page" class="catalog-page" aria-labelledby="catalog-title">
    <!-- Cabecera Editorial del Catálogo -->
    <header class="catalog-hero">
      <div class="catalog-hero-copy">
        <span class="catalog-page-eyebrow">Biblioteca Digital</span>
        <div class="catalog-title-row">
          <h1 id="catalog-title">Catálogo</h1>
          <span id="catalog-summary" class="catalog-summary-pill" aria-live="polite"><span class="is-loading is-loading--md"></span></span>
        </div>
        <p class="catalog-hero-subtitle">Explora mangas, manhwas y manhuas en español con la mejor calidad y lectura continua.</p>
      </div>
    </header>

    <!-- Barra Limpia de Filtrado Rápido y Orden -->
    <section class="catalog-control-bar" aria-label="Herramientas de filtrado y orden">
      <div class="catalog-toolbar-primary">
        <!-- Píldoras Rápidas de Formato y Estado (1 clic) -->
        <div class="catalog-quick-rails">
          <div class="catalog-quick-group">
            <span class="catalog-quick-label">Formato</span>
            <div id="catalog-quick-formats" class="catalog-quick-pills" role="group" aria-label="Filtrar rápido por formato">
              <button type="button" class="catalog-quick-pill is-active" data-format-id="">Todos</button>
            </div>
          </div>

          <div class="catalog-quick-divider" aria-hidden="true"></div>

          <div class="catalog-quick-group">
            <span class="catalog-quick-label">Estado</span>
            <div id="catalog-quick-statuses" class="catalog-quick-pills" role="group" aria-label="Filtrar rápido por estado">
              <button type="button" class="catalog-quick-pill is-active" data-status-id="">Todos</button>
            </div>
          </div>
        </div>

        <div class="catalog-toolbar-right">
          <!-- Selector directo de Orden -->
          <div class="catalog-sort-box">
            <label for="catalog-sort-select" class="catalog-sort-label">Ordenar</label>
            <select id="catalog-sort-select" class="catalog-sort-select" aria-label="Ordenar obras por">
              <option value="relevance">Relevancia</option>
              <option value="popular">Popularidad</option>
              <option value="recent">Más recientes</option>
              <option value="title_asc">Título A–Z</option>
            </select>
          </div>

          <!-- Botón de Géneros y Demografía (sin duplicar Formato/Estado/Orden) -->
          <button id="works-filter-toggle" class="works-filter-toggle" type="button" aria-expanded="false" aria-controls="works-filter-panel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/><circle cx="6" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
            <span>Géneros y Demografía</span>
            <span id="works-filter-count" class="works-filter-count" hidden>0</span>
          </button>
        </div>
      </div>

      <!-- Chips de Filtros Activos -->
      <div id="works-active-filters-bar" class="works-active-filters-bar" hidden>
        <div id="works-active-filters" class="works-active-filters" aria-live="polite"></div>
        <button id="catalog-clear-inline" class="catalog-clear-inline" type="button">Limpiar todo</button>
      </div>
    </section>

    <!-- Backdrop y Panel Lateral Exclusivo para Demografía y Géneros -->
    <div id="works-filter-backdrop" class="works-filter-backdrop" hidden></div>
    <div id="works-filter-panel" class="works-filter-panel" role="dialog" aria-modal="true" aria-labelledby="works-filter-panel-title" hidden>
      <div class="works-filter-panel-head">
        <div>
          <h2 id="works-filter-panel-title">Géneros y Demografía</h2>
          <p class="works-filter-panel-subtitle">Afina tu búsqueda combinando demografía y múltiples temáticas</p>
        </div>
        <button type="button" id="works-filter-panel-close" class="works-filter-panel-close" aria-label="Cerrar filtros">
          <img src="/assets/icons/svg/actions/x.svg" width="18" height="18" alt="" aria-hidden="true">
        </button>
      </div>

      <div class="works-filter-panel-body">
        <!-- Demografía -->
        <div class="works-filter-group works-filter-group-card">
          <div class="works-filter-genres-head">
            <p class="works-filter-group-title">Demografía</p>
            <span class="works-filter-genres-hint">Selección única</span>
          </div>
          <div id="works-demographics" class="works-filter-options"></div>
        </div>

        <!-- Géneros (con todo el espacio disponible) -->
        <div class="works-filter-group works-filter-group-card works-filter-group-card--genres">
          <div class="works-filter-genres-head">
            <p class="works-filter-group-title">Géneros</p>
            <span class="works-filter-genres-hint">Puedes elegir varios</span>
          </div>
          <div id="works-genres" class="works-filter-options works-filter-options--genres"></div>
        </div>
      </div>

      <div class="works-filter-panel-actions">
        <button id="works-reset-filters" class="works-reset-filters" type="button">Limpiar selección</button>
        <button id="works-apply-filters" class="works-apply-filters" type="button">Aplicar</button>
      </div>
    </div>

    <!-- Cuadrícula de Pósters por defecto -->
    <div id="catalog-results" class="catalog-result-list" data-skeleton="catalog" data-skeleton-count="14" aria-live="polite" aria-busy="true"></div>

    <!-- Paginación -->
    <nav id="catalog-pagination" class="catalog-pagination" aria-label="Páginas del catálogo" hidden></nav>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="/js/components/components-loader.js"></script>
  <script type="module" src="/js/pages/catalogo.js"></script>
</body>
</html>
