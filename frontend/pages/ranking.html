<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Ranking de mangas, manhwas y manhuas más populares en YumeZone. Próximamente disponible.">
  <link rel="icon" type="image/png" href="/assets/icons/logo.png">
  <title>Ranking | YumeZone</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/header.css">
  <link rel="stylesheet" href="/css/components/ranking.css">
</head>
<body>
  <header id="header"></header>
  <main id="ranking-page" class="ranking-page" aria-labelledby="ranking-title">
    <header class="ranking-page-heading">
      <p class="ranking-page-eyebrow">YumeZone Charts</p>
      <h1 id="ranking-title">Ranking Global</h1>
      <p id="ranking-summary" class="ranking-page-summary" aria-live="polite">
        Las series más aclamadas y populares de la plataforma.
      </p>
    </header>
    <section class="works-filter-bar" aria-label="Filtros de ranking">
        <div class="ranking-tabs">
            <button class="hs-tab is-active" type="button" data-period="all">Total</button>
            <button class="hs-tab" type="button" data-period="monthly">Mensual</button>
            <button class="hs-tab" type="button" data-period="weekly">Semanal</button>
        </div>
    </section>
    <div id="ranking-results" class="ranking-list" aria-live="polite" aria-busy="false"></div>
  </main>
  <script type="module" src="/js/pages/ranking.js"></script>
</body>
</html>
