<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - YumeZone</title>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-root"></div>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <!-- Topbar -->
            <div id="topbar-root"></div>

            <main>
                <div class="auth-layout">
        <div class="auth-card">
            <a href="/index.html" class="auth-logo">Yume<span>Zone</span></a>
            <p class="auth-subtitle">Crea tu cuenta para empezar</p>
            
            <div id="register-error" class="auth-error">Error al registrarse.</div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="form-control" placeholder="tu_usuario" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Tu contraseña" required>
                </div>
                
                <button type="submit" id="register-btn" class="btn-auth">Registrarse</button>
            </form>

            <div class="auth-register-link">
                ¿Ya tienes una cuenta? <a href="/login.html">Inicia sesión aquí</a>
            </div>
        </div>
                </div>
            </main>

            <!-- Footer -->
            <div id="footer-root"></div>
        </div>
    </div>

    <script src="js/utils/config.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/pages/register.js"></script>
    <script>
        injectLayout();
    </script>
</body>
</html>
