<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <meta name="description"
    content="YumeZone: descubre y lee mangas, manhwas y manhuas con capítulos, tendencias y novedades actualizadas.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YumeZone">
  <meta property="og:url" content="https://yumezone.page/">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="YumeZone | Mangas, manhwas y manhuas">
  <meta property="og:description"
    content="Descubre tus próximas lecturas y sigue las novedades de mangas, manhwas y manhuas en YumeZone.">
  <meta property="og:image" content="https://yumezone.page/assets/images/logo.png">
  <meta property="og:image:alt" content="Logotipo de YumeZone">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="https://yumezone.page/">
  <meta name="twitter:title" content="YumeZone | Mangas, manhwas y manhuas">
  <meta name="twitter:description"
    content="Descubre tus próximas lecturas y sigue las novedades en YumeZone.">
  <meta name="twitter:image" content="https://yumezone.page/assets/images/logo.png">
  <meta name="twitter:image:alt" content="Logotipo de YumeZone">
  <link rel="canonical" href="https://yumezone.page/">
  <link rel="icon" type="image/png" href="assets/icons/logo.png">
  <link rel="apple-touch-icon" href="assets/icons/logo.png">
  <title>YumeZone | Mangas, manhwas y manhuas</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/header.css">
  <link rel="stylesheet" href="/css/components/notice.css">
  <link rel="stylesheet" href="/css/components/hero.css">
  <link rel="stylesheet" href="/css/components/home-sections.css">
</head>

<body>
  <header id="header"></header>
  <div id="notice"></div>
  <main id="app">
    <section id="hero" class="hero" aria-label="Obras destacadas">
      <div class="hero-stage" data-home-hero-stage>
        <!-- Slides se insertan aquí dinámicamente -->
      </div>

      <div class="hero-skeleton" data-home-hero-skeleton aria-hidden="true">
        <div class="hero-skeleton-bg"></div>
        <div class="hero-skeleton-content">
          <div class="hero-skeleton-line hero-skeleton-line-sm"></div>
          <div class="hero-skeleton-line hero-skeleton-line-lg"></div>
          <div class="hero-skeleton-line hero-skeleton-line-md"></div>
          <div class="hero-skeleton-line hero-skeleton-line-sm"></div>
        </div>
      </div>

      <div class="hero-error" data-home-hero-error hidden>
        <p>No se pudieron cargar las obras destacadas.</p>
        <button type="button" class="hero-retry" data-home-hero-retry>Reintentar</button>
      </div>

      <div class="hero-footer" data-home-hero-footer hidden>
        <div class="hero-dots" data-home-hero-dots aria-label="Seleccionar obra destacada"></div>
      </div>
    </section>
    <noscript>
      <p>YumeZone necesita JavaScript para mostrar las obras destacadas y sus capítulos.</p>
    </noscript>
  </main>
  <div id="home-sections"></div>
  <template id="hero-slide-template">
    <article class="hero-slide">
      <div class="hero-bg">
        <img class="hero-bg-image" alt="" decoding="async" data-home-hero-bg-image>
        <div class="hero-bg-gradient"></div>
      </div>
      <div class="hero-content">
        <div class="hero-main">
          <div class="hero-badges">
            <span class="hero-badge">
              <img class="hero-icon" width="12" height="12" alt="" aria-hidden="true" data-home-hero-badge-icon>
              <span data-home-hero-badge-text></span>
            </span>
            <span class="hero-rating" title="Calificar esta obra" data-home-hero-rating-badge role="button" tabindex="0">
              <img class="hero-icon" width="12" height="12" src="assets/icons/svg/star.svg" alt="" aria-hidden="true">
              <span data-home-hero-rating></span>
              <span class="hero-rating-count">(<span data-home-hero-rating-count></span>)</span>
            </span>
            <span class="hero-scan" data-home-hero-scan>
              <img src="" alt="" class="hero-scan-logo" loading="lazy" decoding="async" data-home-hero-scan-logo>
              <span data-home-hero-scan-name></span>
            </span>
          </div>
          <div class="hero-eyebrow">
            <img class="hero-icon" width="14" height="14" src="assets/icons/svg/info.svg" alt="" aria-hidden="true">
            <span data-home-hero-alternative-title></span>
          </div>
          <h1 class="hero-title">
            <span class="hero-title-top" data-home-hero-title-top></span>
            <span class="hero-title-accent" data-home-hero-title-accent></span>
          </h1>

          <p class="hero-synopsis" data-home-hero-synopsis></p>
          <div class="hero-genres" data-home-hero-genres>
            <span class="hero-update">
              <img class="hero-icon" width="14" height="14" src="assets/icons/svg/history.svg" alt="" aria-hidden="true">
              <span data-home-hero-published-text></span>
            </span>
          </div>
          <div class="hero-actions">
            <a href="#" class="hero-cta hero-cta-primary" data-home-hero-read-link>
              <img class="hero-icon" width="18" height="18" src="assets/icons/svg/play.svg" alt="" aria-hidden="true">
              <span data-home-hero-read-text>Leer</span>
            </a>
            <button type="button" class="hero-cta hero-cta-secondary" data-home-hero-library-btn>
              <img class="hero-icon hero-library-icon" width="16" height="16" src="assets/icons/svg/heart.svg" alt="" aria-hidden="true">
              <span data-home-hero-library-text></span>
            </button>
            <a href="#" class="hero-cta hero-cta-view" data-home-hero-detail-link
              aria-label="Ver detalles de la obra">
              <img class="hero-icon" width="18" height="18" src="assets/icons/svg/eye.svg" alt="" aria-hidden="true">
              <span>Detalles</span>
            </a>
          </div>
        </div>
        <aside class="hero-next" aria-label="Próximo capítulo">
          <header class="hero-next-header">
            <img class="hero-icon" width="14" height="14" src="assets/icons/svg/history.svg" alt="" aria-hidden="true">
            <span data-home-hero-next-label>Próximo Capítulo</span>
            <span class="hero-next-status" data-home-hero-next-status></span>
          </header>
          <h3 class="hero-next-title" data-home-hero-next-title></h3>
          <p class="hero-next-meta" data-home-hero-next-release></p>
          <footer class="hero-next-footer">
            <span class="hero-next-scan">Subido por <span data-home-hero-next-scan></span></span>
            <a href="#" class="hero-next-cta" data-home-hero-next-link aria-label="Ver detalles de la obra">
              <span>Ver obra</span>
              <img class="hero-icon" width="12" height="12" src="assets/icons/svg/arrow-right.svg" alt="" aria-hidden="true">
            </a>
          </footer>
        </aside>
      </div>
    </article>
  </template>
  <dialog id="hero-rating-modal" class="rating-modal" aria-labelledby="rating-modal-title">
    <div class="rating-modal-backdrop" data-rating-modal-close></div>
    <div class="rating-modal-card">
      <header class="rating-modal-header">
        <div class="rating-modal-icon-wrap">
          <img src="assets/icons/svg/star.svg" alt="" width="22" height="22">
        </div>
        <div class="rating-modal-title-group">
          <h2 id="rating-modal-title" class="rating-modal-title">Calificar Obra</h2>
          <p class="rating-modal-subtitle" id="rating-modal-work-title">Obra</p>
        </div>
        <button type="button" class="rating-modal-close-btn" data-rating-modal-close aria-label="Cerrar">&times;</button>
      </header>
      <div class="rating-modal-body">
        <div id="rating-status-pill" class="rating-status-pill is-unrated">
          <span class="rating-status-dot"></span>
          <span id="rating-status-text">Sin calificar aún</span>
        </div>
        <div class="rating-score-display">
          <span id="rating-score-num" class="rating-score-num">—</span>
          <span class="rating-score-max">/ 10</span>
        </div>
        <div id="rating-score-label" class="rating-score-label">Toca una estrella o mueve el selector</div>
        <div class="rating-stars-preview" id="rating-stars-preview" aria-label="Selector de estrellas de 1 a 10"></div>
        <div class="rating-slider-wrap">
          <button type="button" class="rating-step-btn" id="rating-minus-btn" aria-label="Restar 0.5">-0.5</button>
          <input type="range" id="rating-range-slider" class="rating-range-slider" min="1.0" max="10.0" step="0.1" value="8.0" aria-label="Seleccionar calificación de 1.0 a 10.0">
          <button type="button" class="rating-step-btn" id="rating-plus-btn" aria-label="Sumar 0.5">+0.5</button>
        </div>
        <div class="rating-presets" id="rating-presets">
          <button type="button" class="rating-preset-chip" data-val="5.0">5.0</button>
          <button type="button" class="rating-preset-chip" data-val="6.5">6.5</button>
          <button type="button" class="rating-preset-chip" data-val="7.5">7.5</button>
          <button type="button" class="rating-preset-chip" data-val="8.5">8.5</button>
          <button type="button" class="rating-preset-chip" data-val="9.0">9.0</button>
          <button type="button" class="rating-preset-chip" data-val="9.5">9.5</button>
          <button type="button" class="rating-preset-chip" data-val="10.0">10.0 ★</button>
        </div>
      </div>
      <footer class="rating-modal-footer">
        <button type="button" class="rating-modal-btn rating-modal-btn--ghost" data-rating-modal-close>Cancelar</button>
        <button type="button" class="rating-modal-btn rating-modal-btn--primary" id="rating-submit-btn">Guardar calificación</button>
      </footer>
    </div>
  </dialog>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YumeZone",
      "url": "https://yumezone.page/",
      "description": "Plataforma para descubrir y leer mangas, manhwas y manhuas.",
      "inLanguage": "es"
    }
  </script>
  <script type="module" src="/js/pages/home.js"></script>
  <script type="module">
    import { renderHomeSections } from '/js/pages/home-sections.js';
    const initSections = () => {
      const el = document.getElementById('home-sections');
      if (el) renderHomeSections(el);
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSections);
    } else {
      initSections();
    }
  </script>
</body>

</html>
